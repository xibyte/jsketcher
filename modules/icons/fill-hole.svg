<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95949f"/>
      <stop offset="1" stop-color="#78777f"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7268a0"/>
      <stop offset="0.55" stop-color="#4a436a"/>
      <stop offset="1" stop-color="#2a2640"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e89595"/>
      <stop offset="1" stop-color="#8a4040"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.4" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="outerClip">
      <path d="M 34 36 Q 64 26 94 36 Q 99 40 104 64 Q 64 54 24 64 Q 29 40 34 36 Z
               M 48 35 Q 64 33 80 35 Q 83 40 83 49 Q 64 47 45 49 Q 47 40 48 35 Z"
            clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Gray background -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Outer NURBS surface: domed + perspective, with aligned 4-edge hole -->
  <path d="M 34 36 Q 64 26 94 36 Q 99 40 104 64 Q 64 54 24 64 Q 29 40 34 36 Z
           M 48 35 Q 64 33 80 35 Q 83 40 83 49 Q 64 47 45 49 Q 47 40 48 35 Z"
        fill="url(#surface)" fill-rule="evenodd"/>

  <!-- Soft top highlight on the dome -->
  <path d="M 34 36 Q 64 26 94 36 Q 99 40 104 64 Q 64 54 24 64 Q 29 40 34 36 Z"
        fill="url(#highlight)"/>

  <!-- Isolines on outer surface: sampled from the same UV grid as the hole -->
  <g clip-path="url(#outerClip)" fill="none" stroke="#9a8ec0" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <!-- U isolines (u = 0.25, 0.5, 0.75) -->
    <path d="M 48 32 Q 48 36 44 60"/>
    <path d="M 64 31 Q 64 35 64 59"/>
    <path d="M 79 32 Q 82 36 84 60"/>
    <!-- V isolines (v = 0.25, 0.5, 0.75) -->
    <path d="M 31 39 Q 64 29 97 39"/>
    <path d="M 29 45 Q 64 35 99 45"/>
    <path d="M 27 53 Q 64 43 101 53"/>
  </g>

  <!-- Outer boundary stroke -->
  <path d="M 34 36 Q 64 26 94 36 Q 99 40 104 64 Q 64 54 24 64 Q 29 40 34 36 Z"
        fill="none" stroke="#1b1730" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hole inner dark edge for depth -->
  <path d="M 48 35 Q 64 33 80 35 Q 83 40 83 49 Q 64 47 45 49 Q 47 40 48 35 Z"
        fill="none" stroke="#120e20" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Fill spline patch: shares the hole's boundary exactly -->
  <path d="M 48 35 Q 64 33 80 35 Q 83 40 83 49 Q 64 47 45 49 Q 47 40 48 35 Z"
        fill="url(#patch)" stroke="#431a1a" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Fill patch isolines (slightly stronger dome than parent) -->
  <g fill="none" stroke="#ffcccc" stroke-width="0.85" stroke-linecap="round" opacity="0.92">
    <path d="M 64 34 Q 64 33 64 48"/>
    <path d="M 47 41 Q 64 33 82 41"/>
  </g>

  <!-- Premium accent highlights -->
  <circle cx="34" cy="30" r="1.6" fill="#d0c8e8" opacity="0.9"/>
  <circle cx="104" cy="100" r="1.2" fill="#f8c8c8" opacity="0.8"/>
</svg>
