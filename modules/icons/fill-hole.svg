<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95949f"/>
      <stop offset="1" stop-color="#78777f"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7268a0"/>
      <stop offset="0.55" stop-color="#4a436a"/>
      <stop offset="1" stop-color="#2a2640"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e89595"/>
      <stop offset="1" stop-color="#8a4040"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.35" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="outerClip" clipPathUnits="userSpaceOnUse">
      <path d="M 20 94 Q 18 59 32 36 Q 64 23 96 38 Q 114 61 108 96 Q 64 81 20 94 Z
               M 48 78 Q 44 64 50 52 Q 64 42 78 52 Q 84 64 80 78 Q 64 70 48 78 Z"
            clip-rule="evenodd"/>
    </clipPath>
    <clipPath id="patchClip" clipPathUnits="userSpaceOnUse">
      <path d="M 48 78 Q 40 62 50 52 Q 64 36 78 52 Q 88 62 80 78 Q 64 66 48 78 Z"/>
    </clipPath>
  </defs>

  <!-- Gray background -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Outer NURBS surface: perspective, domed upward, with 4-edge hole -->
  <path d="M 20 94 Q 18 59 32 36 Q 64 23 96 38 Q 114 61 108 96 Q 64 81 20 94 Z
           M 48 78 Q 44 64 50 52 Q 64 42 78 52 Q 84 64 80 78 Q 64 70 48 78 Z"
        fill="url(#surface)" fill-rule="evenodd"/>

  <!-- Soft top highlight on the dome -->
  <path d="M 20 94 Q 18 59 32 36 Q 64 23 96 38 Q 114 61 108 96 Q 64 81 20 94 Z"
        fill="url(#highlight)"/>

  <!-- UV grid on outer surface (curves reveal dome + perspective) -->
  <g clip-path="url(#outerClip)" fill="none" stroke="#9a8ec0" stroke-width="1" stroke-linecap="round" opacity="0.78">
    <!-- U-lines: front-to-back, curving up at the middle (dome) and inward (perspective) -->
    <path d="M 38 92 Q 38 55 42 37"/>
    <path d="M 56 90 Q 58 54 60 35"/>
    <path d="M 74 90 Q 74 52 76 34"/>
    <path d="M 92 93 Q 90 55 88 37"/>
    <!-- V-lines: left-to-right, curving upward at the middle (dome) -->
    <path d="M 14 78 Q 64 66 114 82"/>
    <path d="M 15 58 Q 64 46 113 62"/>
    <path d="M 22 42 Q 64 30 106 46"/>
  </g>

  <!-- Outer surface outline -->
  <path d="M 20 94 Q 18 59 32 36 Q 64 23 96 38 Q 114 61 108 96 Q 64 81 20 94 Z"
        fill="none" stroke="#1b1730" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hole inner dark edge (depth cue) -->
  <path d="M 48 78 Q 44 64 50 52 Q 64 42 78 52 Q 84 64 80 78 Q 64 70 48 78 Z"
        fill="none" stroke="#120e20" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Filling spline patch: domed upward more aggressively, matching the hole -->
  <path d="M 48 78 Q 40 62 50 52 Q 64 36 78 52 Q 88 62 80 78 Q 64 66 48 78 Z"
        fill="url(#patch)" stroke="#431a1a" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- UV grid on fill patch (curved lines show spline dome) -->
  <g clip-path="url(#patchClip)" fill="none" stroke="#ffcccc" stroke-width="0.9" stroke-linecap="round" opacity="0.92">
    <path d="M 56 76 Q 55 55 58 42"/>
    <path d="M 64 78 Q 64 52 64 38"/>
    <path d="M 72 76 Q 73 55 70 42"/>
    <path d="M 42 70 Q 64 58 86 70"/>
    <path d="M 46 58 Q 64 46 82 58"/>
  </g>

  <!-- Premium accent highlights -->
  <circle cx="34" cy="30" r="1.6" fill="#d0c8e8" opacity="0.9"/>
  <circle cx="104" cy="100" r="1.2" fill="#f8c8c8" opacity="0.8"/>
</svg>
