<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95949f"/>
      <stop offset="1" stop-color="#78777f"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6285"/>
      <stop offset="1" stop-color="#312c48"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98989"/>
      <stop offset="1" stop-color="#8a4a4a"/>
    </linearGradient>
    <clipPath id="outerClip">
      <path d="M 20 34 Q 64 24 108 28 Q 118 66 112 102 Q 64 114 16 106 Q 12 66 20 34 Z
               M 46 54 Q 64 50 84 54 Q 90 68 86 84 Q 64 90 42 86 Q 42 68 46 54 Z"
            clip-rule="evenodd"/>
    </clipPath>
    <clipPath id="patchClip">
      <path d="M 46 54 Q 64 42 84 54 Q 94 68 86 84 Q 64 96 42 86 Q 38 68 46 54 Z"/>
    </clipPath>
  </defs>

  <!-- Gray background -->
  <rect width="128" height="128" fill="url(#bg)"/>

  <!-- Outer NURBS surface (with 4-edge hole cut out via evenodd) -->
  <path d="M 20 34 Q 64 24 108 28 Q 118 66 112 102 Q 64 114 16 106 Q 12 66 20 34 Z
           M 46 54 Q 64 50 84 54 Q 90 68 86 84 Q 64 90 42 86 Q 42 68 46 54 Z"
        fill="url(#surface)" fill-rule="evenodd"/>

  <!-- UV grid on outer surface (clipped to surface minus hole) -->
  <g clip-path="url(#outerClip)" fill="none" stroke="#8a80ac" stroke-width="1" opacity="0.75">
    <path d="M 34 28 Q 33 66 32 108"/>
    <path d="M 52 25 Q 52 66 51 111"/>
    <path d="M 68 24 Q 68 66 68 113"/>
    <path d="M 84 24 Q 84 66 85 112"/>
    <path d="M 100 26 Q 101 66 103 109"/>
    <path d="M 14 50 Q 64 44 116 48"/>
    <path d="M 13 68 Q 64 64 117 68"/>
    <path d="M 14 86 Q 64 82 116 88"/>
  </g>

  <!-- Outer surface outline -->
  <path d="M 20 34 Q 64 24 108 28 Q 118 66 112 102 Q 64 114 16 106 Q 12 66 20 34 Z"
        fill="none" stroke="#1c1830" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hole inner edge (dark, for depth) -->
  <path d="M 46 54 Q 64 50 84 54 Q 90 68 86 84 Q 64 90 42 86 Q 42 68 46 54 Z"
        fill="none" stroke="#141022" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Filling spline patch (curved, slightly domed outward) -->
  <path d="M 46 54 Q 64 42 84 54 Q 94 68 86 84 Q 64 96 42 86 Q 38 68 46 54 Z"
        fill="url(#patch)" stroke="#431c1c" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- UV grid on fill patch (curved to show spline curvature) -->
  <g clip-path="url(#patchClip)" fill="none" stroke="#f2b8b8" stroke-width="0.9" opacity="0.9">
    <path d="M 56 46 Q 55 68 54 94"/>
    <path d="M 65 43 Q 65 68 65 96"/>
    <path d="M 75 44 Q 76 68 77 94"/>
    <path d="M 38 62 Q 64 56 92 64"/>
    <path d="M 38 76 Q 64 72 92 78"/>
  </g>

  <!-- Premium accent highlights -->
  <circle cx="30" cy="42" r="1.6" fill="#cac2e0" opacity="0.85"/>
  <circle cx="102" cy="96" r="1.2" fill="#f4c0c0" opacity="0.75"/>
</svg>
