<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7268a0"/>
      <stop offset="0.55" stop-color="#4a436a"/>
      <stop offset="1" stop-color="#2a2640"/>
    </linearGradient>
    <radialGradient id="highlight" cx="64" cy="34" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="outerClip">
      <path d="M 38 27 Q 70 14 102 33 Q 100 36 95 67 Q 58 50 21 61 Q 31 30 38 27 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(-16.5 6) scale(1.3)">
    <!-- Outer NURBS surface -->
    <path d="M 38 27 Q 70 14 102 33 Q 100 36 95 67 Q 58 50 21 61 Q 31 30 38 27 Z"
          fill="url(#surface)"/>

    <!-- Soft dome-peak highlight -->
    <path d="M 38 27 Q 70 14 102 33 Q 100 36 95 67 Q 58 50 21 61 Q 31 30 38 27 Z"
          fill="url(#highlight)"/>

    <!-- Isolines on surface (same UV grid) -->
    <g clip-path="url(#outerClip)" fill="none" stroke="#9a8ec0" stroke-width="0.77" stroke-linecap="round" opacity="0.8">
      <path d="M 54 23 Q 48 28 39 57"/>
      <path d="M 70 22 Q 64 29 58 57"/>
      <path d="M 86 26 Q 81 31 76 60"/>
      <path d="M 34 30 Q 67 21 101 36"/>
      <path d="M 30 37 Q 64 28 99 43"/>
      <path d="M 26 47 Q 60 38 97 53"/>
    </g>

    <!-- Outer boundary stroke -->
    <path d="M 38 27 Q 70 14 102 33 Q 100 36 95 67 Q 58 50 21 61 Q 31 30 38 27 Z"
          fill="none" stroke="#1b1730" stroke-width="1.92" stroke-linejoin="round"/>
  </g>
</svg>
